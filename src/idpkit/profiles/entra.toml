name = "entra"
display = "Microsoft Entra ID (v2.0 endpoint, app-only token)"
# tenant = tenant ID (GUID) or domain; scope = "api://<api-app-id>/.default". The API app
# registration must set accessTokenAcceptedVersion = 2, or tokens come back as v1
# (iss sts.windows.net, appid instead of azp).
discovery_url = "https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration"
token_url = "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token"
auth = "post"
fields = ["tenant", "client_id", "client_secret", "scope"]
params = { scope = "{scope}" }
verified = true
verified_on = "2026-11-23"
notes = """
Verified with a real token (fixtures/claims/entra/client-credentials.json): aud is the
API's client ID as a bare GUID (not api://...), azp names the calling client (no client_id
claim), sub = oid = the caller's service principal, application permissions are in roles,
no scp. idtyp is absent unless added as an optional claim. Tokens live about 65 minutes.
"""
sources = [
  "https://learn.microsoft.com/en-us/entra/identity-platform/access-token-claims-reference",
  "https://learn.microsoft.com/entra/identity-platform/claims-validation",
]

[shape]
client_claim = "azp"
audience = true
scope_claim = "roles"
scope_format = "list"
extra = { ver = "2.0" }
